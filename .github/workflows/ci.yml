name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run Ruff Linter
        run: |
          ruff check src/ tests/

      - name: Run Mypy Typecheck
        run: |
          mypy src/promolift

      - name: Run Unit & Integration Tests
        run: |
          pytest tests/ --cov=promolift --cov-report=term-missing

      - name: Test Package Build
        run: |
          pip install build
          python -m build --wheel

  docker-smoke:
    name: Docker Build & Smoke Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start services in detached mode
        run: docker compose up -d

      - name: Smoke test API & Dashboard
        run: |
          sleep 12
          docker compose ps
          curl --retry 5 --retry-delay 3 -f http://localhost:8000/health
          curl --retry 5 --retry-delay 3 -f http://localhost:8000/model-info
          curl --retry 5 --retry-delay 3 -f http://localhost:8501/_stcore/health

      - name: Teardown Docker compose
        if: always()
        run: docker compose down -v
