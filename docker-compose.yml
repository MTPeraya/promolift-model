services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: promolift:latest
    container_name: promolift-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/production
      - LOG_LEVEL=INFO
      - MPLCONFIGDIR=/tmp/matplotlib
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    image: promolift:latest  # reuse the same image built above — no double build
    container_name: promolift-dashboard
    restart: unless-stopped
    command: [
      "streamlit", "run", "src/app.py",
      "--server.port=8501",
      "--server.address=0.0.0.0",
      "--server.headless=true",
      "--browser.gatherUsageStats=false"
    ]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - MODEL_PATH=/app/models/production
      - MPLCONFIGDIR=/tmp/matplotlib
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: nginx:1.27-alpine
    container_name: promolift-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./demo.html:/usr/share/nginx/html/demo.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
