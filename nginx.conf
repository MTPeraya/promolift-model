server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index demo.html;

    location / {
        try_files $uri $uri/ /demo.html;
        add_header Cache-Control "no-cache";
    }

    # Health check endpoint for Docker healthcheck
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
